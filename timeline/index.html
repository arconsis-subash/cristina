<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Journey</title>
    <style>
        :root {
            --bg-dark: #0b0f14;
            --panel: #0f1720;
            --accent: #ff6b9f;
            --muted-light: #9aa6b2;
            --text-light: #e6eef6;
            --branch: linear-gradient(180deg, rgba(255,107,159,0.14), rgba(255,107,159,0.06));
        }

        * { box-sizing: border-box; margin: 0; padding: 0 }

        body {
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            padding: 40px 20px;
            background: radial-gradient(circle at 10% 10%, rgba(255,255,255,0.02), transparent 8%),
                        linear-gradient(180deg, #071019 0%, #0b0f14 100%);
            background-color: var(--bg-dark);
        }

        .container { max-width: 1000px; margin: 0 auto }

        header { display: flex; align-items: center; gap: 16px; margin-bottom: 36px }

        h1 { margin: 0; font-size: 30px; color: var(--text-light) }

        .subtitle { color: var(--muted-light); font-size: 14px }

        .timeline { position: relative; padding: 40px 0; margin-top: 8px }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%; transform: translateX(-50%);
            width: 6px; height: 100%; background: var(--branch); top: 0; border-radius: 6px;
            box-shadow: 0 0 30px rgba(255,150,180,0.04);
        }

        .timeline-item { position: relative; width: 50%; padding: 18px 32px; margin-bottom: 46px }
        .timeline-item:nth-child(odd) { left: 0; text-align: right }
        .timeline-item:nth-child(even) { left: 50%; text-align: left }

        .timeline-content { display: inline-block; background: rgba(16,22,28,0.6); padding: 16px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); max-width:520px; transition: transform .25s ease, box-shadow .25s ease; backdrop-filter: blur(6px); }
        .timeline-content:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(0,0,0,0.7) }

        .timeline-date { font-size: 13px; color: var(--muted-light); margin-bottom: 10px }

        .timeline-row { display:flex; align-items:center; gap:18px }

        /* larger, clickable photos */
        .timeline-photo { width: 180px; height: 180px; border-radius: 14px; overflow:hidden; flex-shrink:0; box-shadow: 0 10px 30px rgba(0,0,0,0.6); cursor: pointer; border: 3px solid rgba(255,255,255,0.04); }
        .timeline-photo img { width:100%; height:100%; object-fit:cover; display:block; transition: transform .35s ease; }
        .timeline-photo:hover img { transform: scale(1.06); }

        .timeline-text { flex: 1 }
        .timeline-title { font-weight:700; color:var(--text-light); margin-bottom:6px }
        .timeline-description { color:var(--muted-light); font-size:0.95em; line-height:1.45 }

        .timeline-dot { position:absolute; left:50%; transform:translateX(-50%); width:22px; height:22px; background:var(--accent); border-radius:50%; box-shadow:0 8px 20px rgba(255,107,159,0.14); z-index:10; top:18px }

        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:1000 }
        .modal.open { display:flex }
        .modal-inner { background:#0b1115; color:var(--text-light); padding:22px; border-radius:12px; max-width:92vw; max-height:92vh; overflow:auto }
        .modal-inner h2 { margin-top:0 }
        .modal-inner img { max-width:90vw; border-radius:12px; display:block; margin-top:12px }
        .modal-date { margin-top:8px; color:var(--muted-light); font-size:13px }
        .modal-description { margin-top:12px; color:var(--muted-light); line-height:1.6 }

        @media (max-width:720px) {
            body { padding: 20px }
            .timeline::before { left:28px }
            .timeline-item { width:100%; left:0 !important; padding-left:84px; padding-right:20px; text-align:left !important }
            .timeline-dot { left:28px }
            .timeline-content { max-width:100% }
            .timeline-row { flex-direction:column; align-items:flex-start }
            .timeline-photo { width:100%; height:auto; aspect-ratio: 1; border-radius:12px }
            .timeline-photo img { transform:none }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div style="font-size: 48px">💖</div>
            <div>
                <h1>Cristina & Subash — Our Timeline <span style="color: var(--accent)">♥</span></h1>
                <div class="subtitle">A little interactive memory lane — add photos, relive moments.</div>
            </div>
        </header>

        <section class="timeline" id="timeline"></section>
    </div>

    <div class="modal" id="modal">
        <div class="modal-inner" id="modalInner"></div>
    </div>

    <script>
        // Load timeline from JSON file
        async function loadTimelineFromJSON() {
            try {
                const response = await fetch('./data/timeline.json');
                const data = await response.json();
                return data.timeline;
            } catch (error) {
                console.error('Error loading timeline from JSON:', error);
                return [];
            }
        }

        function loadEvents(){
            try{
                const raw = localStorage.getItem('cristina_timeline_events');
                if(raw) return JSON.parse(raw);
            }catch(e){console.warn(e)}
            return [];
        }

        function formatDate(d){
            const dt = new Date(d);
            if(isNaN(dt)) return d;
            return dt.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'});
        }

        const timeline = document.getElementById('timeline');
        async function render(){
            // Load from JSON as primary source
            let events = await loadTimelineFromJSON();
            
            // If no JSON events, try localStorage
            if(events.length === 0) {
                events = loadEvents();
            }
            
            // Sort by date
            events = events.slice().sort((a,b)=> new Date(a.date) - new Date(b.date));
            
            timeline.querySelectorAll('.timeline-item').forEach(n=>n.remove());
            events.forEach((ev,i)=>{
                const el = document.createElement('div'); 
                el.className = 'timeline-item';
                
                const content = document.createElement('div'); 
                content.className='timeline-content';
                
                const date = document.createElement('div'); 
                date.className='timeline-date'; 
                date.textContent = formatDate(ev.date);
                
                const row = document.createElement('div'); 
                row.className='timeline-row';
                
                const photoWrap = document.createElement('div'); 
                photoWrap.className='timeline-photo';
                const img = document.createElement('img'); 
                
                // Construct proper image path
                if(ev.image) {
                    img.src = './images/' + ev.image;
                } else {
                    img.src = placeholderSVG(ev.color || '#ffd6e8');
                }
                
                img.alt = ev.title || 'photo';
                img.onerror = function() {
                    // If image fails to load, use placeholder
                    this.src = placeholderSVG(ev.color || '#ffd6e8');
                };
                img.addEventListener('click', ()=> openModal(ev));
                photoWrap.appendChild(img);
                
                const txt = document.createElement('div'); 
                txt.className='timeline-text';
                const h = document.createElement('div'); 
                h.className='timeline-title';
                h.textContent = ev.title || '';
                const p = document.createElement('p'); 
                p.className='timeline-description';
                p.textContent = ev.description || '';
                txt.appendChild(h); 
                txt.appendChild(p);
                
                if(i%2===0){ 
                    row.appendChild(txt); 
                    row.appendChild(photoWrap);
                } else { 
                    row.appendChild(photoWrap); 
                    row.appendChild(txt);
                }        
                
                content.appendChild(date); 
                content.appendChild(row);
                el.appendChild(content);
                
                const dot = document.createElement('div'); 
                dot.className='timeline-dot'; 
                el.appendChild(dot);
                
                timeline.appendChild(el);
            });
        }

        function placeholderSVG(color){
            const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'><rect width='100%' height='100%' fill='${color}'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='36' fill='#fff'>Your photo here</text></svg>`;
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        const modal = document.getElementById('modal');
        const modalInner = document.getElementById('modalInner');
        function openModal(ev){
            let imgSrc = ev.image ? './images/' + ev.image : placeholderSVG(ev.color || '#ffd6e8');
            modalInner.innerHTML = `<h2>${escapeHtml(ev.title||'')}</h2><div class="modal-date">${formatDate(ev.date)}</div><div style='margin-top:12px'><img src='${imgSrc}' style='max-width:100%;border-radius:12px' onerror="this.src='${placeholderSVG(ev.color || '#ffd6e8')}'" /></div><p class="modal-description">${escapeHtml(ev.description||'')}</p>`;
            modal.classList.add('open');
        }
        modal.addEventListener('click',(e)=>{ if(e.target===modal) modal.classList.remove('open'); });

        function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]); }

        // Initial render when page loads
        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
